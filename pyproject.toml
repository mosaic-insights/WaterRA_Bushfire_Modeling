[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = 'fire_impacts'
description="Library for modelling impacts of bushfire on water quality in water supply catchments"
keywords = ["hydrology", "bushfire", "water quality", "catchment"]
license = {text = "ISC License"}
version = "0.1"
readme = {file = "README.md", content-type = "text/markdown"}
# 3.11 floor: `str | None` appears in signatures without
# `from __future__ import annotations` (e.g. sim/rainfall.py,
# pre/project.py), which is evaluated at import time and needs 3.10+.
# 3.10 reaches end of life in October 2026, so the supported floor is 3.11.
requires-python = ">=3.11"
dependencies = ["numpy", "pandas"]
authors = [
    {name = "Joel Rahman", email = "joel@flowmatters.com.au"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/mosaic-insights/WaterRA_Bushfire_Modeling"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["fire_impacts"]
markers = [
    "network: hits a remote service (DEA STAC, TERN/ASRIS WCS, BoM). Deselected by default.",
    "veneer: needs a live eWater SOURCE/Veneer instance, so Windows only. Deselected by default.",
    "slow: end to end run over the example catchment; takes tens of seconds.",
]
# Network and Veneer tests can't run in CI or on Linux - opt in with
# eg `pytest -m network` or `pytest -m 'network or not network'`.
addopts = "-m 'not network and not veneer'"

# Note: this table was previously spelled [tools.setuptools] (plural), which
# setuptools silently ignores — so include-package-data never took effect and
# the lookup tables were absent from the built wheel.
[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["fire_impacts*"]

[tool.setuptools.package-data]
fire_impacts = ["data/*.csv", "data/*.tsv"]

[project.scripts]
fire-impacts = "fire_impacts.cli:app"

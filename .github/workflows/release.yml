name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        # Catches the packaging mistakes that only surface on upload —
        # a malformed README, a missing classifier, a bad version.
        run: |
          pip install twine
          twine check dist/*

      - name: Verify the wheel carries its package data
        # The lookup tables under fire_impacts/data are the debris-flow
        # triggering model and the constituent concentrations; a wheel
        # without them installs fine and then fails at run time. Checked
        # from a directory outside the checkout, or `import fire_impacts`
        # would resolve to the source tree and prove nothing.
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --upgrade pip
          /tmp/wheeltest/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/wheeltest/bin/python - <<'PY'
          import pathlib, sysconfig
          root = pathlib.Path(sysconfig.get_paths()['purelib']) / 'fire_impacts'
          assert root.is_dir(), f'package not installed at {root}'
          expected = {'HFlookup_b30pt27.csv', 'debris-constituents.csv',
                      'ash_constituents.csv'}
          found = {p.name for p in (root / 'data').glob('*')}
          missing = expected - found
          assert not missing, f'missing package data in the wheel: {missing}'
          print('package data present:', sorted(found))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Publishing to PyPI is deliberately not wired up: it needs either a
  # trusted-publisher configuration on the PyPI project or an API token in
  # repository secrets, and the package name would have to be claimed
  # first. To enable, add a job with
  # `permissions: {id-token: write}` and `pypa/gh-action-pypi-publish`.

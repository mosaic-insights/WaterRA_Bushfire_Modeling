name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version independently: the point of the matrix is to
      # find the version-specific breaks, and one red cell should not hide
      # the others. A get_origin() difference between 3.13 and 3.14 is
      # exactly the class of bug this exists to catch.
      fail-fast: false
      matrix:
        # Every version pyproject.toml claims to support. Testing a subset
        # would mean advertising support we never exercise.
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries
        # pg_config is needed to build dea-tools' psycopg2 dependency from
        # source; the geospatial wheels bring their own GDAL/PROJ.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pysheds is a fork (numpy 2.0 compatibility), so it is not in
          # requirements.txt as a plain name.
          pip install https://github.com/joelrahman/pysheds/archive/refs/heads/master.zip
          pip install -r requirements.txt
          pip install -e '.[test]'

      - name: Show resolved environment
        run: pip list

      - name: Run tests
        # Network and Veneer tests are deselected by pyproject addopts:
        # they need remote services and a Windows-only eWater SOURCE
        # instance respectively.
        run: pytest -q
